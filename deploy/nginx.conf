# Template for a Linux VM, installed in nginx http{} context.
# Replace domain/certificate paths. Auth must be configured before Internet exposure.
limit_req_zone $binary_remote_addr zone=lab_actions:10m rate=4r/s;

server {
    listen 443 ssl;
    server_name lab.example.edu;
    ssl_certificate /etc/letsencrypt/live/lab.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.edu/privkey.pem;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /internal/ { return 404; }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme https;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }

    # Browser API requests receive JSON 401 rather than an HTML login redirect.
    location /api/ {
        auth_request /oauth2/auth;
        limit_req zone=lab_actions burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/fault-lab/gateway-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        proxy_pass http://127.0.0.1:8000;
        include /etc/fault-lab/gateway-headers.conf;
    }
}
